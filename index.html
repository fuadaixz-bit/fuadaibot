<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Universal AI Chat</title>
    
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gemini: {
                            bg: '#ffffff',
                            darkBg: '#131314',
                            surface: '#f0f4f9',
                            darkSurface: '#1e1f20',
                            border: '#e5e7eb',
                            darkBorder: '#374151'
                        }
                    }
                }
            }
        };
    </script>

    <style>
        /* Smooth scrolling */
        html { scroll-behavior: smooth; }
        
        /* Custom scrollbar matching minimal UI */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background-color: rgba(156, 163, 175, 0.4); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background-color: rgba(156, 163, 175, 0.7); }
        
        /* Sidebar hidden scrollbar but functional */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Loader fade transition */
        #loading { transition: opacity 0.3s ease-out; }

        /* Prose overrides for better dark mode code blocks */
        .prose pre { background-color: #1e1e1e !important; color: #d4d4d4 !important; }
        .prose :not(pre) > code { background-color: rgba(156, 163, 175, 0.2); padding: 0.125rem 0.25rem; border-radius: 0.25rem; font-weight: 500;}
    </style>
</head>
<body class="bg-gemini-bg dark:bg-gemini-darkBg text-gray-900 dark:text-gray-100 font-sans antialiased selection:bg-blue-200 dark:selection:bg-blue-900">

    <div id="loading" class="fixed inset-0 bg-white dark:bg-[#131314] flex flex-col items-center justify-center z-[100]">
        <div class="animate-spin rounded-full h-10 w-10 border-4 border-blue-500 border-t-transparent mb-4"></div>
        <div class="text-xl font-medium tracking-wide">Loading App...</div>
    </div>

    <div class="flex min-h-[100dvh] w-full max-w-full relative">
        
        <div id="sidebar-overlay" class="fixed inset-0 bg-black/60 z-30 hidden transition-opacity duration-300" onclick="toggleSidebar()"></div>

        <aside id="sidebar" class="fixed md:sticky top-0 left-0 h-[100dvh] w-72 z-40 transform -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out bg-gemini-surface dark:bg-gemini-darkSurface flex flex-col border-r border-gemini-border dark:border-gemini-darkBorder">
            <div class="p-4 flex items-center justify-between">
                <button onclick="createNewChat()" class="flex items-center space-x-2 bg-gemini-bg dark:bg-[#131314] hover:bg-gray-100 dark:hover:bg-gray-800 text-sm font-medium px-4 py-2.5 rounded-full shadow-sm w-full transition-colors border dark:border-gray-700">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                    <span>New Chat</span>
                </button>
            </div>
            
            <div class="flex-1 overflow-y-auto no-scrollbar px-3 py-2 space-y-1" id="chat-list">
                </div>
            
            <div class="p-4 border-t border-gemini-border dark:border-gemini-darkBorder">
                <button onclick="openSettings()" class="flex items-center space-x-3 text-sm font-medium w-full p-2 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors text-gray-700 dark:text-gray-300">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                    <span>Settings</span>
                </button>
            </div>
        </aside>

        <main class="flex-1 flex flex-col min-h-[100dvh] w-full relative transition-all duration-300">
            
            <header class="h-16 flex items-center justify-between px-4 md:px-6 sticky top-0 z-20 bg-gemini-bg/90 dark:bg-gemini-darkBg/90 backdrop-blur-md">
                <div class="flex items-center space-x-3">
                    <button onclick="toggleSidebar()" class="md:hidden p-2 -ml-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 text-gray-600 dark:text-gray-300">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                    </button>
                    <h1 class="text-xl font-semibold tracking-tight text-gray-800 dark:text-gray-100">AI Chat</h1>
                </div>
                
                <button onclick="toggleDarkMode()" class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 text-gray-600 dark:text-gray-300 transition-colors" title="Toggle Dark Mode">
                    <svg id="icon-sun" class="w-6 h-6 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                    <svg id="icon-moon" class="w-6 h-6 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
                </button>
            </header>

            <div id="chat-container" class="flex-1 w-full max-w-4xl mx-auto p-4 md:px-8 space-y-6 pb-40">
                </div>

            <footer class="sticky bottom-0 w-full bg-gradient-to-t from-gemini-bg via-gemini-bg to-transparent dark:from-gemini-darkBg dark:via-gemini-darkBg dark:to-transparent pt-10 pb-4 md:pb-6 px-4 md:px-8 z-20">
                <div class="max-w-4xl mx-auto relative group">
                    <div class="flex items-end w-full bg-gemini-surface dark:bg-gemini-darkSurface rounded-[28px] overflow-hidden px-4 py-3 border border-gray-300 dark:border-gray-700 focus-within:ring-2 focus-within:ring-blue-500/50 shadow-sm transition-all">
                        <textarea id="chat-input" rows="1" class="flex-1 max-h-[200px] bg-transparent outline-none resize-none py-1.5 text-base text-gray-900 dark:text-gray-100 placeholder-gray-500 dark:placeholder-gray-400 no-scrollbar" placeholder="Ask anything..."></textarea>
                        
                        <button id="send-btn" onclick="sendMessage()" class="ml-2 p-2.5 rounded-full text-white bg-blue-600 hover:bg-blue-700 transition-colors disabled:opacity-50 disabled:cursor-not-allowed flex-shrink-0" title="Send message">
                            <svg class="w-5 h-5 translate-x-px translate-y-px" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                        </button>
                    </div>
                    <div class="text-center text-xs text-gray-500 dark:text-gray-400 mt-3 font-medium">
                        AI can make mistakes. Consider verifying important information.
                    </div>
                </div>
            </footer>
        </main>
    </div>

    <div id="settings-modal" class="fixed inset-0 z-50 bg-black/50 hidden flex items-center justify-center backdrop-blur-sm transition-opacity">
        <div class="bg-white dark:bg-gemini-darkSurface rounded-2xl w-full max-w-lg p-6 m-4 shadow-2xl border border-gray-200 dark:border-gray-700">
            <h2 class="text-2xl font-semibold mb-6 text-gray-900 dark:text-gray-100 flex items-center space-x-2">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                <span>Configuration</span>
            </h2>
            
            <div class="space-y-4 text-left">
                <div>
                    <label class="block mb-1.5 text-sm font-medium text-gray-700 dark:text-gray-300">OpenRouter API Key <span class="text-red-500">*</span></label>
                    <input type="password" id="input-api-key" class="w-full border border-gray-300 dark:border-gray-600 rounded-lg px-4 py-2.5 bg-transparent dark:text-white focus:ring-2 focus:ring-blue-500 outline-none" placeholder="sk-or-v1-...">
                </div>
                
                <div>
                    <label class="block mb-1.5 text-sm font-medium text-gray-700 dark:text-gray-300">Model Name</label>
                    <input type="text" id="input-model" class="w-full border border-gray-300 dark:border-gray-600 rounded-lg px-4 py-2.5 bg-transparent dark:text-white focus:ring-2 focus:ring-blue-500 outline-none" value="deepseek/deepseek-r1:free">
                </div>
                
                <div>
                    <label class="block mb-1.5 text-sm font-medium text-gray-700 dark:text-gray-300">System Prompt</label>
                    <textarea id="input-sys-prompt" rows="3" class="w-full border border-gray-300 dark:border-gray-600 rounded-lg px-4 py-2.5 bg-transparent dark:text-white focus:ring-2 focus:ring-blue-500 outline-none resize-none" placeholder="You are a helpful AI assistant."></textarea>
                </div>
            </div>
            
            <div class="flex justify-end space-x-3 mt-8">
                <button onclick="closeSettings()" class="px-5 py-2.5 rounded-lg font-medium hover:bg-gray-100 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-300 transition-colors">Cancel</button>
                <button onclick="saveSettings()" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg transition-colors shadow-sm">Save Changes</button>
            </div>
        </div>
    </div>

    <script>
        // --- 1. State Management ---
        const DEFAULT_MODEL = 'deepseek/deepseek-r1:free';
        const DEFAULT_PROMPT = 'You are a highly capable, logical, and helpful AI assistant.';
        
        let state = {
            apiKey: localStorage.getItem('or_apiKey') || '',
            model: localStorage.getItem('or_model') || DEFAULT_MODEL,
            systemPrompt: localStorage.getItem('or_sysPrompt') || DEFAULT_PROMPT,
            chats: JSON.parse(localStorage.getItem('or_chats')) || [],
            currentChatId: localStorage.getItem('or_currentChatId') || null
        };

        let isGenerating = false;

        // --- 2. Initialization ---
        window.addEventListener('load', () => {
            initDarkMode();
            
            // Setup Marked.js for Markdown
            if (typeof marked !== 'undefined') {
                marked.use({ breaks: true, gfm: true });
            }

            // Bind Input Events
            const chatInput = document.getElementById('chat-input');
            chatInput.addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = Math.min(this.scrollHeight, 200) + 'px';
            });

            chatInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });

            // Clean invalid states
            if (state.currentChatId && !state.chats.find(c => c.id === state.currentChatId)) {
                state.currentChatId = state.chats.length > 0 ? state.chats[0].id : null;
            }
            
            if (state.chats.length === 0) {
                createNewChat(true); 
            } else {
                renderChatsList();
                renderCurrentChat();
            }

            // Remove Loader Safely
            setTimeout(() => {
                const loader = document.getElementById('loading');
                if (loader) {
                    loader.style.opacity = '0';
                    setTimeout(() => loader.style.display = 'none', 300);
                }
            }, 400);

            // Open settings automatically if no API Key
            if (!state.apiKey) {
                setTimeout(openSettings, 800);
            }
        });

        function saveState() {
            localStorage.setItem('or_chats', JSON.stringify(state.chats));
            if (state.currentChatId) localStorage.setItem('or_currentChatId', state.currentChatId);
            else localStorage.removeItem('or_currentChatId');
        }

        // --- 3. UI Helpers ---
        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, tag => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            }[tag]));
        }

        function scrollToBottom() {
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }

        // --- 4. Dark Mode & Sidebar ---
        function initDarkMode() {
            const savedDark = localStorage.getItem('or_darkMode');
            const wantsDark = savedDark === 'true' || (savedDark === null && window.matchMedia('(prefers-color-scheme: dark)').matches);
            if (wantsDark) document.documentElement.classList.add('dark');
        }

        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark');
            const isDark = document.documentElement.classList.contains('dark');
            localStorage.setItem('or_darkMode', isDark);
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            
            if (sidebar.classList.contains('-translate-x-full')) {
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
            } else {
                sidebar.classList.add('-translate-x-full');
                overlay.classList.add('hidden');
            }
        }

        function closeSidebarOnMobile() {
            if (window.innerWidth < 768) {
                document.getElementById('sidebar').classList.add('-translate-x-full');
                document.getElementById('sidebar-overlay').classList.add('hidden');
            }
        }

        // --- 5. Settings Modal ---
        function openSettings() {
            document.getElementById('input-api-key').value = state.apiKey;
            document.getElementById('input-model').value = state.model;
            document.getElementById('input-sys-prompt').value = state.systemPrompt;
            document.getElementById('settings-modal').classList.remove('hidden');
            document.getElementById('settings-modal').classList.add('flex');
        }

        function closeSettings() {
            document.getElementById('settings-modal').classList.add('hidden');
            document.getElementById('settings-modal').classList.remove('flex');
        }

        function saveSettings() {
            const key = document.getElementById('input-api-key').value.trim();
            if (!key) return alert("API Key is required.");
            
            state.apiKey = key;
            state.model = document.getElementById('input-model').value.trim() || DEFAULT_MODEL;
            state.systemPrompt = document.getElementById('input-sys-prompt').value.trim() || DEFAULT_PROMPT;
            
            localStorage.setItem('or_apiKey', state.apiKey);
            localStorage.setItem('or_model', state.model);
            localStorage.setItem('or_sysPrompt', state.systemPrompt);
            
            closeSettings();
        }

        // --- 6. Chat Management ---
        function createNewChat(preventRender = false) {
            if (isGenerating) return;
            const newChat = {
                id: 'chat_' + Date.now(),
                title: 'New Chat',
                messages: [],
                updatedAt: Date.now()
            };
            state.chats.unshift(newChat);
            state.currentChatId = newChat.id;
            saveState();
            
            if (!preventRender) {
                renderChatsList();
                renderCurrentChat();
                closeSidebarOnMobile();
            }
        }

        function loadChat(id) {
            if (isGenerating) return;
            state.currentChatId = id;
            saveState();
            renderChatsList();
            renderCurrentChat();
            closeSidebarOnMobile();
        }

        function deleteChat(id, event) {
            event.stopPropagation();
            if (!confirm("Are you sure you want to delete this chat?")) return;
            
            state.chats = state.chats.filter(c => c.id !== id);
            if (state.currentChatId === id) {
                state.currentChatId = state.chats.length > 0 ? state.chats[0].id : null;
            }
            if (state.chats.length === 0) createNewChat(true);
            
            saveState();
            renderChatsList();
            renderCurrentChat();
        }

        function renameChat(id, event) {
            event.stopPropagation();
            const chat = state.chats.find(c => c.id === id);
            if (!chat) return;
            
            const newName = prompt("Enter new chat name:", chat.title);
            if (newName && newName.trim()) {
                chat.title = newName.trim();
                saveState();
                renderChatsList();
            }
        }

        function renderChatsList() {
            const list = document.getElementById('chat-list');
            list.innerHTML = '';
            
            // Sort chats by updatedAt descending
            state.chats.sort((a, b) => b.updatedAt - a.updatedAt).forEach(chat => {
                const isActive = chat.id === state.currentChatId;
                
                const item = document.createElement('div');
                item.className = `group flex items-center justify-between p-2.5 rounded-xl cursor-pointer transition-colors ${isActive ? 'bg-gray-200 dark:bg-gray-700/50 text-blue-600 dark:text-blue-400 font-medium' : 'hover:bg-gray-200/50 dark:hover:bg-gray-800 text-gray-700 dark:text-gray-300'}`;
                item.onclick = () => loadChat(chat.id);
                
                const titleSpan = document.createElement('span');
                titleSpan.className = 'truncate flex-1 text-sm select-none pr-2';
                titleSpan.textContent = chat.title || 'New Chat';
                
                const actionsDiv = document.createElement('div');
                actionsDiv.className = 'hidden group-hover:flex space-x-1 flex-shrink-0';
                
                const editBtn = document.createElement('button');
                editBtn.className = 'p-1 rounded hover:bg-gray-300 dark:hover:bg-gray-600 text-gray-500 hover:text-gray-800 dark:hover:text-gray-200 transition-colors';
                editBtn.innerHTML = '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>';
                editBtn.onclick = (e) => renameChat(chat.id, e);
                
                const delBtn = document.createElement('button');
                delBtn.className = 'p-1 rounded hover:bg-gray-300 dark:hover:bg-gray-600 text-gray-500 hover:text-red-500 dark:hover:text-red-400 transition-colors';
                delBtn.innerHTML = '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>';
                delBtn.onclick = (e) => deleteChat(chat.id, e);
                
                actionsDiv.appendChild(editBtn);
                actionsDiv.appendChild(delBtn);
                
                item.appendChild(titleSpan);
                item.appendChild(actionsDiv);
                list.appendChild(item);
            });
        }

        // --- 7. Chat Rendering ---
        function renderCurrentChat() {
            const container = document.getElementById('chat-container');
            container.innerHTML = '';
            
            const chat = state.chats.find(c => c.id === state.currentChatId);
            if (!chat || chat.messages.length === 0) {
                container.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-full text-center space-y-5 pt-16 pb-8 select-none">
                        <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-blue-500 to-purple-500 flex items-center justify-center shadow-lg transform rotate-3">
                           <svg class="w-8 h-8 text-white -rotate-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                        </div>
                        <h2 class="text-3xl md:text-4xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-600 to-purple-600 dark:from-blue-400 dark:to-purple-400 leading-tight">Hello, how can I help?</h2>
                        <p class="text-gray-500 dark:text-gray-400 max-w-sm">Ask me anything or navigate to settings to configure your OpenRouter connection.</p>
                    </div>
                `;
                return;
            }
            
            chat.messages.forEach(msg => {
                container.appendChild(createMessageDOM(msg.role, msg.content));
            });
            scrollToBottom();
        }

        function createMessageDOM(role, content) {
            const isUser = role === 'user';
            const wrapper = document.createElement('div');
            wrapper.className = `flex w-full ${isUser ? 'justify-end' : 'justify-start'} animate-fadeIn`;

            const innerLayout = document.createElement('div');
            innerLayout.className = `flex max-w-[90%] md:max-w-[85%] ${isUser ? 'flex-row-reverse' : 'flex-row'}`;

            // Avatar for AI
            if (!isUser) {
                const avatar = document.createElement('div');
                avatar.className = 'w-8 h-8 rounded-full bg-gradient-to-tr from-blue-500 to-purple-500 flex items-center justify-center flex-shrink-0 mt-1 mr-4 shadow-sm';
                avatar.innerHTML = `<svg class="w-5 h-5 text-white" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/></svg>`;
                innerLayout.appendChild(avatar);
            }

            // Message Bubble
            const bubble = document.createElement('div');
            if (isUser) {
                bubble.className = 'bg-[#f0f4f9] dark:bg-[#333538] text-gray-900 dark:text-gray-100 px-5 py-3 rounded-[24px] rounded-tr-sm text-[15px] leading-relaxed break-words shadow-sm';
                bubble.innerHTML = escapeHTML(content).replace(/\n/g, '<br>');
            } else {
                bubble.className = 'prose prose-neutral dark:prose-invert prose-p:leading-relaxed max-w-none break-words text-gray-800 dark:text-gray-200 text-[15px] assistant-content w-full';
                bubble.innerHTML = typeof marked !== 'undefined' ? marked.parse(content) : content;
            }

            innerLayout.appendChild(bubble);
            wrapper.appendChild(innerLayout);
            return wrapper;
        }

        // --- 8. Network & Streaming ---
        async function sendMessage() {
            if (isGenerating) return;
            
            const inputEl = document.getElementById('chat-input');
            const text = inputEl.value.trim();
            if (!text) return;
            
            if (!state.apiKey) {
                openSettings();
                return;
            }

            // Update UI Pre-flight
            inputEl.value = '';
            inputEl.style.height = 'auto';
            const sendBtn = document.getElementById('send-btn');
            
            isGenerating = true;
            sendBtn.disabled = true;
            inputEl.disabled = true;
            
            // Get active chat
            let chat = state.chats.find(c => c.id === state.currentChatId);
            if (!chat) {
                createNewChat(true);
                chat = state.chats[0];
            }

            chat.updatedAt = Date.now();

            // Append User Message
            chat.messages.push({ role: 'user', content: text });
            
            // Generate Title on first message
            if (chat.messages.length === 1 && chat.title === 'New Chat') {
                chat.title = text.length > 30 ? text.slice(0, 30) + '...' : text;
                renderChatsList();
            }
            
            renderCurrentChat();

            // Setup Assistant Placeholder
            chat.messages.push({ role: 'assistant', content: '' });
            const assistantIdx = chat.messages.length - 1;
            
            const container = document.getElementById('chat-container');
            const placeholderDOM = createMessageDOM('assistant', '');
            container.appendChild(placeholderDOM);
            scrollToBottom();

            const targetBubble = placeholderDOM.querySelector('.assistant-content');
            targetBubble.innerHTML = '<span class="inline-block w-2 h-4 bg-blue-500 animate-pulse mt-1 rounded-sm"></span>';

            try {
                // Build payload
                const payload = {
                    model: state.model,
                    messages: [
                        { role: "system", content: state.systemPrompt },
                        ...chat.messages.slice(0, -1) // Excluding empty assistant msg
                    ],
                    stream: true
                };

                const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${state.apiKey}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    const err = await response.json().catch(() => ({}));
                    throw new Error(err.error?.message || `HTTP ${response.status}`);
                }

                if (!response.body) throw new Error("No response body.");

                const reader = response.body.getReader();
                const decoder = new TextDecoder("utf-8");
                let buffer = "";

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop(); // save incomplete line

                    for (const line of lines) {
                        const trimmed = line.trim();
                        if (!trimmed || !trimmed.startsWith('data: ')) continue;
                        
                        const dataStr = trimmed.slice(6);
                        if (dataStr === '[DONE]') continue;

                        try {
                            const data = JSON.parse(dataStr);
                            const chunk = data.choices[0]?.delta?.content;
                            if (chunk) {
                                chat.messages[assistantIdx].content += chunk;
                                // Fast render with blinking cursor
                                targetBubble.innerHTML = marked.parse(chat.messages[assistantIdx].content) + '<span class="inline-block w-2 h-4 bg-gray-400 dark:bg-gray-500 animate-pulse ml-1 rounded-sm align-middle"></span>';
                                scrollToBottom();
                            }
                        } catch (e) {
                            // Suppress partial JSON errors native to streaming chunks
                        }
                    }
                }
                
                // Final solid render
                targetBubble.innerHTML = marked.parse(chat.messages[assistantIdx].content);

            } catch (error) {
                chat.messages[assistantIdx].content += `\n\n**Error:** ${error.message}`;
                targetBubble.innerHTML = marked.parse(chat.messages[assistantIdx].content);
                targetBubble.classList.add('text-red-500');
            } finally {
                // Cleanup State
                isGenerating = false;
                sendBtn.disabled = false;
                inputEl.disabled = false;
                inputEl.focus();
                
                saveState();
                renderChatsList(); // Re-sort list based on new updatedAt
                scrollToBottom();
            }
        }
    </script>
</body>
</html>
